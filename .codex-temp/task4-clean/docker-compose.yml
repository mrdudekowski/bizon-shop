services:
  postgres:
    image: postgres:16-alpine
    container_name: bizon-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bizon
    volumes:
      - bizon_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bizon"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bizon_pg_data:
