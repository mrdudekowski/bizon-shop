name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bizon
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bizon"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URI: postgresql://postgres:postgres@localhost:5432/bizon
      PAYLOAD_SECRET: ci-build-placeholder-secret-min-32-chars-long
      NEXT_PUBLIC_SITE_URL: https://bizontires.example

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Seed database
        run: npm run seed:all

      - name: Verify database
        run: npm run verify:db

      - name: Build
        run: npm run build
